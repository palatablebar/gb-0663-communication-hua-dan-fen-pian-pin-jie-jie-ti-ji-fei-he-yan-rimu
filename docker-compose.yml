name: p1109-0663
services:
  app:
    build: .
    ports: ["${PORT:-18202}:8000"]
    environment:
      DB_PATH: /data/cdrforge.sqlite3
    volumes: ["records:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  records:
